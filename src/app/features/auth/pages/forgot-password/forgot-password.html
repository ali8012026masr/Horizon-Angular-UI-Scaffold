<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-1">Forgot Password</h1>
          <p class="text-muted mb-4">Enter the email on your account and we'll send you a reset code.</p>

          @if (!submitted()) {
            <form [formGroup]="form" (ngSubmit)="submit()" class="row g-3">
              <div class="col-12">
                <label class="form-label">Email</label>
                <input class="form-control" type="email" formControlName="email" [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid" />
                <div class="invalid-feedback">Enter a valid email address.</div>
              </div>
              @if (error()) {
                <div class="col-12 alert alert-danger mb-0">{{ error() }}</div>
              }
              <div class="col-12">
                <button class="btn btn-primary w-100" type="submit" [disabled]="loading()">
                  @if (loading()) { Sending... } @else { Send reset code }
                </button>
              </div>
            </form>
          } @else {
            <div class="alert alert-success">{{ message() }}</div>
            <a routerLink="/reset-password" class="btn btn-primary w-100">I have a code, reset my password</a>
          }

          <div class="mt-3 text-center">
            <a routerLink="/">Back to home</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
